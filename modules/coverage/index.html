<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QualisVision - QualisCoverage</title>
<script src="../../assets/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #0a0c10;
    --surface: #12151c;
    --surface2: #1a1e28;
    --surface3: #222736;
    --border: #2a2f3d;
    --accent: #4fffb0;
    --accent2: #7b6cff;
    --accent3: #ff6b6b;
    --accent4: #ffd166;
    --text: #e8eaf0;
    --text2: #8892a4;
    --text3: #4a5568;
    --radius: 12px;
    --radius-sm: 6px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic UI', 'Meiryo', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ========== TITLEBAR ========== */
  .titlebar {
    height: 48px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    -webkit-app-region: drag;
    flex-shrink: 0;
    gap: 10px;
  }
  .titlebar-back {
    -webkit-app-region: no-drag;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text2);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .titlebar-back:hover { border-color: var(--text3); color: var(--text); }
  .titlebar-sep {
    color: var(--text3);
    font-size: 14px;
    -webkit-app-region: no-drag;
  }
  .titlebar-breadcrumb {
    display: flex;
    align-items: center;
    gap: 6px;
    -webkit-app-region: no-drag;
  }
  .titlebar-parent {
    font-size: 13px;
    font-weight: 700;
    color: var(--text3);
    letter-spacing: 0.05em;
  }
  .titlebar-child {
    font-family: 'IBM Plex Mono', 'Consolas', monospace;
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.03em;
  }
  .titlebar-version {
    font-family: 'IBM Plex Mono', 'Consolas', monospace;
    font-size: 11px;
    color: var(--text3);
    margin-left: 4px;
  }

  /* ========== LAYOUT ========== */
  .app-layout {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ========== SIDEBAR ========== */
  .sidebar {
    width: 300px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow-y: auto;
  }

  .sidebar-section {
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-label {
    font-family: 'IBM Plex Mono', 'Consolas', monospace;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.15em;
    color: var(--text3);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  /* ========== UPLOAD ZONE ========== */
  .upload-zone {
    border: 1.5px dashed var(--border);
    border-radius: var(--radius);
    padding: 20px 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--bg);
  }
  .upload-zone:hover, .upload-zone.drag-over {
    border-color: var(--accent);
    background: rgba(79, 255, 176, 0.04);
  }
  .upload-icon {
    font-size: 28px;
    margin-bottom: 8px;
    display: block;
  }
  .upload-text {
    font-size: 12px;
    color: var(--text2);
    line-height: 1.6;
  }
  .upload-text strong {
    color: var(--accent);
    font-weight: 500;
  }
  .file-loaded {
    background: rgba(79, 255, 176, 0.06);
    border-color: var(--accent);
    border-style: solid;
  }
  .file-name {
    font-family: 'IBM Plex Mono', 'Consolas', monospace;
    font-size: 11px;
    color: var(--accent);
    word-break: break-all;
    margin-top: 6px;
  }

  /* ========== COLUMN SELECTOR ========== */
  .col-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-height: 280px;
    overflow-y: auto;
  }
  .col-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background 0.15s;
    user-select: none;
  }
  .col-item:hover { background: var(--surface2); }
  .col-item.excluded { opacity: 0.4; }
  .col-checkbox {
    width: 16px;
    height: 16px;
    border: 1.5px solid var(--border);
    border-radius: 4px;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .col-item.active .col-checkbox {
    background: var(--accent);
    border-color: var(--accent);
  }
  .col-item.active .col-checkbox::after {
    content: '';
    width: 8px;
    height: 5px;
    border-left: 2px solid #0a0c10;
    border-bottom: 2px solid #0a0c10;
    transform: rotate(-45deg) translateY(-1px);
    display: block;
  }
  .col-name {
    font-size: 12px;
    color: var(--text);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .col-badge {
    font-family: 'IBM Plex Mono', 'Consolas', monospace;
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 3px;
    background: rgba(255, 107, 107, 0.15);
    color: var(--accent3);
  }
  .col-badge.auto { background: rgba(255, 209, 102, 0.15); color: var(--accent4); }

  /* ========== N FACTOR SELECTOR ========== */
  .n-selector {
    display: flex;
    gap: 6px;
  }
  .n-btn {
    flex: 1;
    padding: 8px 4px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text2);
    font-family: 'IBM Plex Mono', 'Consolas', monospace;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }
  .n-btn:hover { border-color: var(--accent2); color: var(--text); }
  .n-btn.active {
    background: var(--accent2);
    border-color: var(--accent2);
    color: white;
  }

  /* ========== ANALYZE BUTTON ========== */
  .analyze-btn {
    width: 100%;
    padding: 12px;
    border-radius: var(--radius);
    border: none;
    background: linear-gradient(135deg, var(--accent) 0%, #00d4ff 100%);
    color: #0a0c10;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .analyze-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 20px rgba(79, 255, 176, 0.3);
  }
  .analyze-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  /* ========== MAIN CONTENT ========== */
  .main-content {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* ========== EMPTY STATE ========== */
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    color: var(--text3);
  }
  .empty-icon { font-size: 64px; opacity: 0.3; }
  .empty-title {
    font-family: 'IBM Plex Mono', 'Consolas', monospace;
    font-size: 20px;
    font-weight: 700;
    color: var(--text3);
  }
  .empty-sub { font-size: 13px; color: var(--text3); }

  /* ========== RESULT CARDS ========== */
  .result-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    position: relative;
    overflow: hidden;
  }
  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
  }
  .stat-card.green::before { background: var(--accent); }
  .stat-card.purple::before { background: var(--accent2); }
  .stat-card.red::before { background: var(--accent3); }
  .stat-card.yellow::before { background: var(--accent4); }

  .stat-value {
    font-family: 'IBM Plex Mono', 'Consolas', monospace;
    font-size: 32px;
    font-weight: 800;
    line-height: 1;
    margin-bottom: 4px;
  }
  .stat-card.green .stat-value { color: var(--accent); }
  .stat-card.purple .stat-value { color: var(--accent2); }
  .stat-card.red .stat-value { color: var(--accent3); }
  .stat-card.yellow .stat-value { color: var(--accent4); }
  .stat-unit { font-size: 14px; font-weight: 400; }
  .stat-label { font-size: 12px; color: var(--text2); }

  /* ========== SECTION HEADER ========== */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .section-title {
    font-family: 'IBM Plex Mono', 'Consolas', monospace;
    font-size: 15px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-badge {
    font-family: 'IBM Plex Mono', 'Consolas', monospace;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 20px;
    background: var(--surface3);
    color: var(--text2);
  }

  /* ========== PANEL ========== */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .panel-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .panel-title {
    font-family: 'IBM Plex Mono', 'Consolas', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.03em;
  }

  /* ========== COVERAGE TABLE ========== */
  .coverage-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  .coverage-table th {
    font-family: 'IBM Plex Mono', 'Consolas', monospace;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text3);
    padding: 10px 14px;
    text-align: left;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
  }
  .coverage-table td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    vertical-align: middle;
  }
  .coverage-table tr:last-child td { border-bottom: none; }
  .coverage-table tr:hover td { background: var(--surface2); }

  /* ========== PROGRESS BAR ========== */
  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .progress-bar {
    flex: 1;
    height: 6px;
    background: var(--surface3);
    border-radius: 3px;
    overflow: hidden;
    min-width: 80px;
  }
  .progress-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.6s ease;
  }
  .progress-fill.high { background: var(--accent); }
  .progress-fill.mid { background: var(--accent4); }
  .progress-fill.low { background: var(--accent3); }
  .progress-value {
    font-family: 'IBM Plex Mono', 'Consolas', monospace;
    font-size: 12px;
    font-weight: 500;
    min-width: 45px;
    text-align: right;
  }
  .progress-value.high { color: var(--accent); }
  .progress-value.mid { color: var(--accent4); }
  .progress-value.low { color: var(--accent3); }

  /* ========== UNCOVERED DETAIL ========== */
  .uncovered-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .uncovered-header {
    padding: 12px 16px;
    background: rgba(255, 107, 107, 0.07);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }
  .uncovered-header:hover { background: rgba(255, 107, 107, 0.12); }
  .uncovered-title {
    font-family: 'IBM Plex Mono', 'Consolas', monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent3);
  }
  .uncovered-count {
    font-family: 'IBM Plex Mono', 'Consolas', monospace;
    font-size: 11px;
    color: var(--accent3);
    margin-left: auto;
  }
  .uncovered-body {
    padding: 12px 16px;
    display: none;
    flex-direction: column;
    gap: 6px;
    max-height: 240px;
    overflow-y: auto;
  }
  .uncovered-body.open { display: flex; }
  .uncovered-combo {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .combo-tag {
    font-family: 'IBM Plex Mono', 'Consolas', monospace;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text2);
  }

  /* ========== VALUE BALANCE ========== */
  .balance-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 10px;
    padding: 16px;
  }
  .balance-factor {
    background: var(--surface2);
    border-radius: var(--radius-sm);
    padding: 12px;
  }
  .balance-factor-name {
    font-family: 'IBM Plex Mono', 'Consolas', monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 10px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .balance-item {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .balance-val {
    font-size: 11px;
    color: var(--text2);
    min-width: 60px;
    max-width: 80px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .balance-bar {
    flex: 1;
    height: 5px;
    background: var(--surface3);
    border-radius: 3px;
    overflow: hidden;
  }
  .balance-fill {
    height: 100%;
    background: var(--accent2);
    border-radius: 3px;
  }
  .balance-pct {
    font-family: 'IBM Plex Mono', 'Consolas', monospace;
    font-size: 10px;
    color: var(--text3);
    min-width: 34px;
    text-align: right;
    flex-shrink: 0;
  }

  /* ========== HEATMAP ========== */
  .heatmap-wrap {
    overflow-x: auto;
    padding: 16px;
  }
  .heatmap-table {
    border-collapse: collapse;
    font-size: 11px;
  }
  .heatmap-table th {
    padding: 6px 12px;
    font-family: 'IBM Plex Mono', 'Consolas', monospace;
    font-size: 10px;
    color: var(--text2);
    background: var(--surface2);
    border: 1px solid var(--border);
    text-align: center;
    white-space: nowrap;
  }
  .heatmap-table td {
    padding: 8px 14px;
    border: 1px solid var(--border);
    text-align: center;
    font-family: 'IBM Plex Mono', 'Consolas', monospace;
    transition: background 0.2s;
  }
  .heatmap-label {
    font-size: 11px;
    color: var(--text2);
    text-align: right !important;
    padding-right: 14px !important;
    white-space: nowrap;
  }

  /* ========== DUPLICATES ========== */
  .dup-list {
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 300px;
    overflow-y: auto;
  }
  .dup-item {
    background: var(--surface2);
    border: 1px solid rgba(255, 107, 107, 0.2);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  .dup-rows {
    font-family: 'IBM Plex Mono', 'Consolas', monospace;
    font-size: 10px;
    color: var(--accent3);
    flex-shrink: 0;
    min-width: 80px;
  }
  .dup-values {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    flex: 1;
  }
  .dup-tag {
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 4px;
    background: var(--surface3);
    color: var(--text2);
    border: 1px solid var(--border);
  }

  /* ========== EXPORT BUTTONS ========== */
  .export-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .export-btn {
    padding: 8px 16px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .export-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ========== TABS ========== */
  .tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
    gap: 0;
    overflow-x: auto;
  }
  .tab {
    padding: 11px 16px;
    font-size: 12px;
    font-family: 'IBM Plex Mono', 'Consolas', monospace;
    font-weight: 600;
    color: var(--text3);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    margin-bottom: -1px;
    user-select: none;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text2); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* ========== LOADING ========== */
  .loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 12, 16, 0.8);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    flex-direction: column;
    gap: 16px;
  }
  .loading-overlay.show { display: flex; }
  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 13px; color: var(--text2); }

  /* ========== FACTOR VALUE SUMMARY ========== */
  .factor-summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px;
    padding: 16px;
  }
  .factor-summary-card {
    background: var(--surface2);
    border-radius: var(--radius-sm);
    padding: 12px;
  }
  .factor-summary-name {
    font-family: 'IBM Plex Mono', 'Consolas', monospace;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 8px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .factor-values-list {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .factor-value-chip {
    font-family: 'IBM Plex Mono', 'Consolas', monospace;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 4px;
    background: var(--surface3);
    border: 1px solid var(--border);
    color: var(--text2);
  }
  .factor-value-count {
    font-size: 10px;
    color: var(--text3);
    margin-top: 4px;
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text3); }
</style>
</head>
<body>

<div class="titlebar">
  <button class="titlebar-back" onclick="window.location.href='../../index.html'">← ホーム</button>
  <span class="titlebar-sep">/</span>
  <div class="titlebar-breadcrumb">
    <span class="titlebar-parent">QualisVision</span>
    <span class="titlebar-sep">›</span>
    <span class="titlebar-child">QualisCoverage</span>
  </div>
  <span class="titlebar-version">v0.1.0</span>
</div>

<div class="app-layout">
  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="sidebar-section">
      <div class="sidebar-label">ファイル読み込み</div>
      <div class="upload-zone" id="uploadZone">
        <span class="upload-icon">📂</span>
        <div class="upload-text">
          <strong>クリックまたはドロップ</strong><br>
          .xlsx / .xls / .tsv ファイル
        </div>
      </div>
      <div id="fileInfo" style="display:none; margin-top:8px;">
        <div class="file-name" id="fileName"></div>
        <div style="font-size:11px; color:var(--text3); margin-top:4px;" id="fileStats"></div>
      </div>
      <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none">
    </div>

    <div class="sidebar-section" id="columnSection" style="display:none">
      <div class="sidebar-label">分析対象列の選択</div>
      <div style="font-size:11px; color:var(--text3); margin-bottom:8px;">
        🟡 自動除外候補 &nbsp; チェックで対象に追加
      </div>
      <div class="col-list" id="colList"></div>
      <div style="margin-top:8px; display:flex; gap:8px;">
        <button class="export-btn" style="font-size:11px; padding:5px 10px;" onclick="selectAllCols()">全選択</button>
        <button class="export-btn" style="font-size:11px; padding:5px 10px;" onclick="clearAllCols()">全解除</button>
      </div>
    </div>

    <div class="sidebar-section" id="nSection" style="display:none">
      <div class="sidebar-label">N因子カバレッジ</div>
      <div class="n-selector" id="nSelector">
        <div class="n-btn active" data-n="2">2</div>
        <div class="n-btn active" data-n="3">3</div>
        <div class="n-btn" data-n="4">4</div>
        <div class="n-btn" data-n="5">5</div>
      </div>
      <div style="font-size:11px; color:var(--text3); margin-top:8px;">
        ※ N≥4は因子数・値域が多い場合、計算に時間がかかります
      </div>
    </div>

    <div class="sidebar-section" id="analyzeSection" style="display:none">
      <button class="analyze-btn" id="analyzeBtn" onclick="runAnalysis()">
        🔍 分析を実行
      </button>
    </div>

  </aside>

  <!-- MAIN -->
  <main class="main-content" id="mainContent">
    <div class="empty-state">
      <div class="empty-icon">🔬</div>
      <div class="empty-title">QualisCoverage</div>
      <div class="empty-sub">Excelファイルを読み込んで分析を開始してください</div>
    </div>
  </main>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text" id="loadingText">分析中...</div>
</div>

<script src="analysis.js"></script>
<script src="export.js"></script>
<script src="app.js"></script>
</body>
</html>

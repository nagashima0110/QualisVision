<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QualisBug - バグ分析</title>
  <script src="../../assets/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --bg2: #161b22;
      --bg3: #1c2128;
      --border: #30363d;
      --text: #e6edf3;
      --text2: #8b949e;
      --accent: #4fffb0;
      --accent2: #7b6cff;
      --accent3: #ff6b6b;
      --accent4: #ffd93d;
      --accent5: #4fafff;
      --good: #3fb950;
      --warn: #d29922;
      --bad: #f85149;
      --radius: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', 'Noto Sans JP', sans-serif;
      font-size: 14px; min-height: 100vh;
    }

    /* ヘッダー */
    .app-header {
      background: var(--bg2); border-bottom: 1px solid var(--border);
      padding: 12px 24px; display: flex; align-items: center; gap: 16px;
    }
    .app-header .logo { font-size: 20px; font-weight: 700; color: var(--accent3); letter-spacing: -0.5px; }
    .app-header .sub  { color: var(--text2); font-size: 13px; }
    .app-header .back-link {
      margin-left: auto; color: var(--text2); text-decoration: none;
      font-size: 13px; cursor: pointer; background: none; border: none;
      display: none; padding: 6px 12px; border-radius: var(--radius);
      transition: background 0.2s;
    }
    .app-header .back-link:hover { background: var(--bg3); color: var(--text); }

    .main { max-width: 1400px; margin: 0 auto; padding: 24px; }

    /* ボタン */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 18px; border-radius: var(--radius); border: none;
      font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.15s;
    }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-primary:hover:not(:disabled) { background: #3de8a0; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-secondary { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--border); }
    .btn-danger { background: transparent; color: var(--bad); border: 1px solid var(--bad); }
    .btn-danger:hover { background: #f8514922; }

    /* アップロードゾーン */
    #uploadSection { margin-bottom: 24px; }
    .drop-zone {
      border: 2px dashed var(--border); border-radius: var(--radius);
      padding: 48px 24px; text-align: center; cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .drop-zone:hover, .drop-zone.drag-over {
      border-color: var(--accent3); background: #ff6b6b0d;
    }
    .drop-icon { font-size: 40px; margin-bottom: 12px; }
    .drop-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
    .drop-sub { color: var(--text2); font-size: 13px; }
    #fileInfo { margin-top: 12px; color: var(--accent); font-size: 13px; }
    #errorMsg {
      display: none; background: #f8514922; border: 1px solid var(--bad);
      color: var(--bad); padding: 10px 16px; border-radius: var(--radius); margin-top: 12px;
    }

    /* マッピングセクション */
    #mappingSection { display: none; }
    .section-title {
      font-size: 15px; font-weight: 700; color: var(--text2);
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
    }
    .profile-bar {
      display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap;
    }
    .profile-bar select, .profile-bar input[type="text"] {
      background: var(--bg3); border: 1px solid var(--border); color: var(--text);
      border-radius: var(--radius); padding: 6px 10px; font-size: 13px;
    }
    .profile-bar input[type="text"] { width: 180px; }

    .mapping-group { margin-bottom: 20px; }
    .mapping-group-label {
      font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
      color: var(--accent2); margin-bottom: 10px;
    }
    .mapping-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px;
    }
    .mapping-row {
      display: flex; flex-direction: column; gap: 4px;
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 8px 10px;
    }
    .mapping-label {
      font-size: 11px; font-weight: 600; color: var(--text2);
      letter-spacing: 0.3px;
    }
    .mapping-select {
      width: 100%; background: var(--bg2); border: 1px solid var(--border);
      color: var(--text); border-radius: 4px; padding: 5px 8px; font-size: 12px;
    }
    .mapping-select:focus { outline: none; border-color: var(--accent2); }

    .run-bar { display: flex; justify-content: flex-end; margin-top: 20px; }

    /* 結果セクション */
    #resultsSection { display: none; }

    /* タブ */
    #mainTabs {
      display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px;
      border-bottom: 1px solid var(--border); margin-bottom: 24px;
      scrollbar-width: thin; scrollbar-color: var(--border) transparent;
    }
    #mainTabs::-webkit-scrollbar { height: 4px; }
    #mainTabs::-webkit-scrollbar-track { background: transparent; }
    #mainTabs::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .tab {
      background: none; border: none; color: var(--text2); font-size: 13px; font-weight: 500;
      padding: 8px 16px; cursor: pointer; border-radius: var(--radius) var(--radius) 0 0;
      transition: color 0.15s, background 0.15s; white-space: nowrap;
    }
    .tab:hover { color: var(--text); background: var(--bg3); }
    .tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* KPI */
    .kpi-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px; margin-bottom: 24px;
    }
    .kpi-card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px; text-align: center;
    }
    .kpi-value { font-size: 26px; font-weight: 700; color: var(--accent); line-height: 1.1; }
    .kpi-label { font-size: 12px; color: var(--text2); margin-top: 4px; }
    .kpi-sub   { font-size: 11px; color: var(--text2); margin-top: 2px; opacity: 0.7; }

    /* チャートグリッド */
    .charts-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 16px; margin-bottom: 24px;
    }
    .chart-card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px;
    }
    .chart-card.full-width { grid-column: 1 / -1; }
    .chart-card-title {
      font-size: 13px; font-weight: 600; color: var(--text2);
      margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
    }
    .chart-area { width: 100%; min-height: 280px; }

    /* ダッシュボード */
    .dash-charts {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 16px;
    }
    .dash-chart-card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px;
    }
    .dash-chart-title { font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 8px; }

    /* 信頼性成長曲線 */
    .growth-info {
      display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px;
    }
    .info-card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px; font-size: 13px; line-height: 1.8;
      flex: 1; min-width: 200px;
    }

    /* テーブル */
    .dre-table-wrap { margin-top: 20px; overflow-x: auto; }
    .data-table {
      width: 100%; border-collapse: collapse; font-size: 13px;
    }
    .data-table th, .data-table td {
      padding: 8px 12px; border: 1px solid var(--border); text-align: left;
    }
    .data-table th { background: var(--bg3); color: var(--text2); font-weight: 600; }
    .data-table tr:hover td { background: var(--bg3); }
    td.good { color: var(--good); font-weight: 600; }
    td.warn { color: var(--warn); font-weight: 600; }
    td.bad  { color: var(--bad);  font-weight: 600; }

    /* ゾーン分析 */
    .zone-layout { display: flex; gap: 20px; align-items: flex-start; }
    .zone-left { flex: 1.5; min-width: 0; }
    .zone-right { flex: 1; min-width: 280px; }
    .zone-effort-title { font-size: 13px; font-weight: 600; color: var(--text2); margin-bottom: 10px; }
    .zone-effort-table { max-height: 360px; overflow-y: auto; margin-bottom: 12px; }
    .effort-input {
      width: 80px; background: var(--bg3); border: 1px solid var(--border);
      color: var(--text); border-radius: 4px; padding: 4px 6px; font-size: 12px;
    }
    .effort-input:focus { outline: none; border-color: var(--accent2); }
    .zone-legend { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
    .zone-legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .zone-badge {
      display: inline-block; width: 24px; height: 24px; border-radius: 4px;
      font-size: 10px; font-weight: 700; text-align: center; line-height: 24px;
    }
    .zone-badge.q1 { background: #ff6b6b33; color: #ff6b6b; border: 1px solid #ff6b6b66; }
    .zone-badge.q2 { background: #ffd93d33; color: #ffd93d; border: 1px solid #ffd93d66; }
    .zone-badge.q3 { background: #4fafff33; color: #4fafff; border: 1px solid #4fafff66; }
    .zone-badge.q4 { background: #4fffb033; color: #4fffb0; border: 1px solid #4fffb066; }

    @media (max-width: 768px) {
      .zone-layout { flex-direction: column; }
      .charts-grid { grid-template-columns: 1fr; }
    }

    /* no-data */
    .no-data {
      color: var(--text2); font-size: 14px; padding: 40px 20px;
      text-align: center; line-height: 1.8;
    }

    /* ローディング */
    #loadingOverlay {
      display: none; position: fixed; inset: 0; background: rgba(13,17,23,0.85);
      z-index: 1000; justify-content: center; align-items: center; flex-direction: column; gap: 16px;
    }
    .loading-spinner {
      width: 40px; height: 40px; border: 3px solid var(--border);
      border-top-color: var(--accent3); border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    .loading-text { color: var(--text2); font-size: 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">処理中…</div>
</div>

<header class="app-header">
  <span class="logo">QualisBug</span>
  <span class="sub">バグ傾向・信頼性成長分析</span>
  <button class="back-link" id="backBtn" onclick="goBack()">← 設定に戻る</button>
</header>

<div class="main">

  <!-- アップロード -->
  <div id="uploadSection">
    <div class="drop-zone" id="dropZone">
      <div class="drop-icon">🐛</div>
      <div class="drop-title">バグ管理Excelファイルをドロップ</div>
      <div class="drop-sub">Jira / Redmine / 独自Excel / .xlsx .xls 対応</div>
    </div>
    <div id="fileInfo"></div>
    <div id="errorMsg"></div>
  </div>

  <!-- 列マッピング -->
  <div id="mappingSection">
    <div class="section-title">列マッピング設定</div>

    <!-- プロファイル管理 -->
    <div class="profile-bar">
      <select id="profileSelect"><option value="">（プロファイルなし）</option></select>
      <button class="btn btn-secondary" onclick="loadProfile()">読み込み</button>
      <button class="btn btn-danger" onclick="deleteProfile()">削除</button>
      <input type="text" id="profileName" placeholder="プロファイル名">
      <button class="btn btn-secondary" onclick="saveProfile()">保存</button>
    </div>

    <!-- マッピングフィールド -->
    <div id="mappingFields"></div>

    <div class="run-bar">
      <button class="btn btn-primary" id="runBtn" disabled>▶ 分析実行</button>
    </div>
  </div>

  <!-- 分析結果 -->
  <div id="resultsSection">
    <div id="mainTabs"></div>
    <div id="tabContents"></div>
  </div>

</div>

<script src="analysis.js"></script>
<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>
